<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, sans-serif; fill:#111; }
      .subtitle { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, sans-serif; fill:#333; }
      .lane { stroke:#222; stroke-width:2; fill:none; }
      .laneLabel { font:700 14px system-ui, -apple-system, BlinkMacSystemFont, sans-serif; fill:#111; }
      .box { rx:14; ry:14; stroke:#222; stroke-width:2; fill:#fff; }
      .boxTitle { font:700 16px system-ui, -apple-system, BlinkMacSystemFont, sans-serif; fill:#111; }
      .boxSub { font:400 13px system-ui, -apple-system, BlinkMacSystemFont, sans-serif; fill:#333; }
      .arrow { stroke:#222; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .note { font:400 12px system-ui, -apple-system, BlinkMacSystemFont, sans-serif; fill:#555; }
      .score { font:700 14px system-ui, -apple-system, BlinkMacSystemFont, sans-serif; fill:#111; }
    </style>
  </defs>

  <!-- Title -->
  <text x="40" y="50" class="title">Figure 5 — Publishing as a Gradable Assignment</text>
  <text x="40" y="74" class="subtitle">Scores are produced by system evidence, not subjective judgment</text>

  <!-- Swimlanes -->
  <rect x="40" y="110" width="880" height="140" class="lane"/>
  <text x="60" y="135" class="laneLabel">Student / Author</text>

  <rect x="40" y="260" width="880" height="170" class="lane"/>
  <text x="60" y="285" class="laneLabel">System</text>

  <rect x="40" y="440" width="880" height="120" class="lane"/>
  <text x="60" y="465" class="laneLabel">Instructor / Organization</text>

  <!-- Student boxes -->
  <rect x="120" y="150" width="230" height="70" class="box"/>
  <text x="235" y="180" text-anchor="middle" class="boxTitle">Submit Content</text>
  <text x="235" y="202" text-anchor="middle" class="boxSub">docs/ + Makefile conventions</text>

  <rect x="400" y="150" width="230" height="70" class="box"/>
  <text x="515" y="180" text-anchor="middle" class="boxTitle">Run Commands</text>
  <text x="515" y="202" text-anchor="middle" class="boxSub">make bootstrap && make build</text>

  <rect x="680" y="150" width="200" height="70" class="box"/>
  <text x="780" y="180" text-anchor="middle" class="boxTitle">Commit Records</text>
  <text x="780" y="202" text-anchor="middle" class="boxSub">commit / tag (traceable)</text>

  <!-- System boxes -->
  <rect x="120" y="310" width="230" height="80" class="box"/>
  <text x="235" y="345" text-anchor="middle" class="boxTitle">QA Gate</text>
  <text x="235" y="368" text-anchor="middle" class="boxSub">Pass / Fail</text>

  <rect x="400" y="310" width="230" height="80" class="box"/>
  <text x="515" y="345" text-anchor="middle" class="boxTitle">Build Gate</text>
  <text x="515" y="368" text-anchor="middle" class="boxSub">Generate dist/ artifacts</text>

  <rect x="680" y="310" width="200" height="80" class="box"/>
  <text x="780" y="345" text-anchor="middle" class="boxTitle">Evidence</text>
  <text x="780" y="368" text-anchor="middle" class="boxSub">Logs + outputs + versions</text>

  <!-- Rubric -->
  <text x="120" y="420" class="note">Example grading rubric (100 points total):</text>
  <text x="140" y="450" class="score">+30 pts: QA passed</text>
  <text x="330" y="450" class="score">+40 pts: Build succeeded</text>
  <text x="560" y="450" class="score">+20 pts: Complete artifacts (zh + en)</text>
  <text x="820" y="450" class="score" text-anchor="end">+10 pts: Version traceable</text>

  <!-- Instructor boxes -->
  <rect x="120" y="485" width="330" height="55" class="box"/>
  <text x="285" y="517" text-anchor="middle" class="boxTitle">Acceptance (Pass / Fail)</text>

  <rect x="500" y="485" width="380" height="55" class="box"/>
  <text x="690" y="517" text-anchor="middle" class="boxTitle">Scoring & Feedback (Evidence-based)</text>

  <!-- Arrows -->
  <path class="arrow" d="M 350 185 L 400 185" />
  <path class="arrow" d="M 630 185 L 680 185" />
  <path class="arrow" d="M 515 220 L 235 310" />
  <path class="arrow" d="M 515 220 L 515 310" />
  <path class="arrow" d="M 515 220 L 780 310" />
  <path class="arrow" d="M 350 350 L 400 350" />
  <path class="arrow" d="M 630 350 L 680 350" />
  <path class="arrow" d="M 780 390 L 285 485" />
  <path class="arrow" d="M 780 390 L 690 485" />

  <!-- Footer -->
  <text x="40" y="585" class="note">
    Key idea: instructors do not judge completion — they interpret system-generated evidence.
  </text>
</svg>
